apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: inferon
spec:
  version: {{ .TagName }}
  homepage: https://github.com/klahio/kubectl-inferon
  shortDescription: Find why a model inference service is not serving
  description: |
    Shows why a machine learning model inference service on Kubernetes is
    not serving: the model download, the serving runtime, the model server's
    crash log, the Ingress or Gateway API route, and one inference request.

    - list shows each service as TYPE/NAME with its readiness and the first
      problem found in its pods. The other commands take that TYPE/NAME.
    - status reports a failed model download, a model format that no
      serving runtime supports, and a server that crashes or runs out of
      memory. For vLLM it searches the crash log for the cause (driver
      library not found, GPU or KV cache memory too small, a parallel size
      larger than the pod's GPUs, a refused Hugging Face download), because
      the last line is often only "Engine core initialization failed". It
      shows how long each start phase took, how many GPUs each node has
      free, and whether the external address reaches the model even when
      IngressReady is True.
    - test picks a route that answers (falling back to port-forward) and a
      protocol (v1, v2 Open Inference Protocol, or OpenAI), and sends one
      request. With --stream it also reports the time to the first token
      and the tokens per second.
    - logs prints the model server, the model download or every component,
      without pod names.

    Currently supports KServe v0.16 to v0.21: InferenceService in Standard
    mode and LLMInferenceService. Read-only: it never changes the cluster.
  caveats: |
    The plugin only reads cluster objects. The test command also needs get
    and create permission on pods/portforward when it falls back to
    port-forward.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    {{addURIAndSha "https://github.com/klahio/kubectl-inferon/releases/download/{{ .TagName }}/kubectl-inferon_{{ .TagName }}_linux_amd64.tar.gz" .TagName }}
    files:
    - from: kubectl-inferon
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-inferon
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    {{addURIAndSha "https://github.com/klahio/kubectl-inferon/releases/download/{{ .TagName }}/kubectl-inferon_{{ .TagName }}_linux_arm64.tar.gz" .TagName }}
    files:
    - from: kubectl-inferon
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-inferon
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    {{addURIAndSha "https://github.com/klahio/kubectl-inferon/releases/download/{{ .TagName }}/kubectl-inferon_{{ .TagName }}_darwin_amd64.tar.gz" .TagName }}
    files:
    - from: kubectl-inferon
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-inferon
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    {{addURIAndSha "https://github.com/klahio/kubectl-inferon/releases/download/{{ .TagName }}/kubectl-inferon_{{ .TagName }}_darwin_arm64.tar.gz" .TagName }}
    files:
    - from: kubectl-inferon
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-inferon
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    {{addURIAndSha "https://github.com/klahio/kubectl-inferon/releases/download/{{ .TagName }}/kubectl-inferon_{{ .TagName }}_windows_amd64.zip" .TagName }}
    files:
    - from: kubectl-inferon.exe
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-inferon.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    {{addURIAndSha "https://github.com/klahio/kubectl-inferon/releases/download/{{ .TagName }}/kubectl-inferon_{{ .TagName }}_windows_arm64.zip" .TagName }}
    files:
    - from: kubectl-inferon.exe
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-inferon.exe
