apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: inferon
spec:
  version: {{ .TagName }}
  homepage: https://github.com/klahio/kubectl-inferon
  shortDescription: Diagnose machine learning inference services
  description: |
    Diagnoses machine learning model inference services on Kubernetes, where
    general pod diagnosis tools stop short: it knows the path a model takes
    from storage to an answered request.

    - Model loading: a failed model download in the init container, a model
      format that no serving runtime supports, a model server that crashes
      or runs out of memory while loading. For vLLM servers it searches the
      crash log for the actual cause (driver library not found, GPU out of
      memory, no GPU visible, a refused Hugging Face download), because the
      last line is usually just "Engine core initialization failed".
    - Request path: whether the external address really reaches the model
      through the Ingress or the Gateway API route, even when the service
      reports itself ready, and routes left behind after a migration.
    - A real inference request: the test command finds a working route
      (falling back to port-forward) and the protocol (v1, the v2 Open
      Inference Protocol, or OpenAI chat for language models), sends one
      request and shows the answer.
    - Logs by role: the model server, the model download, or every
      component, without pod names.

    Currently supports KServe v0.16 to v0.21: InferenceService in Standard
    mode (Ingress or Gateway API, canary rollouts) and LLMInferenceService.
    Read-only: it never changes the cluster.
  caveats: |
    The plugin only reads cluster objects. The test command also needs get
    and create permission on pods/portforward when it falls back to
    port-forward.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    {{addURIAndSha "https://github.com/klahio/kubectl-inferon/releases/download/{{ .TagName }}/kubectl-inferon_{{ .TagName }}_linux_amd64.tar.gz" .TagName }}
    files:
    - from: kubectl-inferon
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-inferon
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    {{addURIAndSha "https://github.com/klahio/kubectl-inferon/releases/download/{{ .TagName }}/kubectl-inferon_{{ .TagName }}_linux_arm64.tar.gz" .TagName }}
    files:
    - from: kubectl-inferon
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-inferon
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    {{addURIAndSha "https://github.com/klahio/kubectl-inferon/releases/download/{{ .TagName }}/kubectl-inferon_{{ .TagName }}_darwin_amd64.tar.gz" .TagName }}
    files:
    - from: kubectl-inferon
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-inferon
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    {{addURIAndSha "https://github.com/klahio/kubectl-inferon/releases/download/{{ .TagName }}/kubectl-inferon_{{ .TagName }}_darwin_arm64.tar.gz" .TagName }}
    files:
    - from: kubectl-inferon
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-inferon
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    {{addURIAndSha "https://github.com/klahio/kubectl-inferon/releases/download/{{ .TagName }}/kubectl-inferon_{{ .TagName }}_windows_amd64.zip" .TagName }}
    files:
    - from: kubectl-inferon.exe
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-inferon.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    {{addURIAndSha "https://github.com/klahio/kubectl-inferon/releases/download/{{ .TagName }}/kubectl-inferon_{{ .TagName }}_windows_arm64.zip" .TagName }}
    files:
    - from: kubectl-inferon.exe
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-inferon.exe
